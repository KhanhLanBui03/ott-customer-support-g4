server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: chat-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # AI Gemini
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-flash-lite-latest}

  # Redis Cache & Session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 1000ms

  # Security Default Basic Auth
  security:
    user:
      name: ${SECURITY_USER_NAME:admin}
      password: ${SECURITY_USER_PASSWORD:}

  # Jackson JSON
  jackson:
    serialization:
      write-dates-as-timestamps: true
    deserialization:
      fail-on-unknown-properties: false

  # Mail / SMTP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:${MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SECURE:true}
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000        # 24 hours
  refresh-expiration: 604800000 # 7 days

# ===================================================================
# AWS Configuration (DynamoDB & S3)
# ===================================================================
aws:
  region: ${AWS_REGION:ap-southeast-1}
  accessKey: ${AWS_ACCESS_KEY_ID:}
  secretKey: ${AWS_SECRET_ACCESS_KEY:}

  dynamodb:
    # Để trống nếu dùng AWS Cloud; Điền http://localhost:8000 nếu dùng DynamoDB Local
    endpoint: ${DYNAMODB_ENDPOINT:}
    # Tự động tạo bảng nếu chưa tồn tại trên AWS DynamoDB khi app khởi động
    auto-create-tables: ${DYNAMODB_AUTO_CREATE_TABLES:true}
    # PAY_PER_REQUEST (On-Demand) hoặc PROVISIONED
    billing-mode: ${DYNAMODB_BILLING_MODE:PAY_PER_REQUEST}

  s3:
    bucket: ${AWS_S3_BUCKET:ott-chat-storage-2026}
    region: ${AWS_REGION:ap-southeast-1}
    max-file-size: 104857600  # 100MB

# CORS Configuration
cors:
  allowed-origin-patterns:
    - "http://localhost:*"
    - "http://192.168.1.*:*"
    - "http://172.*.*.*:*"
    - "http://10.*.*.*:*"
    - "http://*.local:*"
    - "https://*.f5chat.online"
    - "https://f5chat.online"
    - "https://*.sslip.io"
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - Content-Type
    - Authorization
    - X-Session-Id
    - X-User-Id
    - X-Device-Id
  credentials: true
  max-age: 3600

# Firebase Configuration
firebase:
  config-path: ${FIREBASE_CONFIG_PATH:}
  database-url: ${FIREBASE_DATABASE_URL:}

# Logging
logging:
  level:
    root: INFO
    com.chatapp: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/chat-app.log

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    export:
      prometheus:
        enabled: false
      defaults:
        enabled: false

# Application Custom Settings
app:
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 5
  pagination:
    default-page-size: 20
    max-page-size: 100
  file-upload:
    max-size: 104857600  # 100MB
    allowed-types:
      - jpg
      - jpeg
      - png
      - gif
      - mp4
      - pdf
      - doc
      - docx
  cache:
    translation-ttl: 86400      # 24h
    message-ttl: 300            # 5 phút
    conversation-ttl: 60        # 1 phút
  translation:
    service-url: ${APP_WHISPER_URL:http://localhost:8000}
    batch-size: 32
  whisper:
    url: ${APP_WHISPER_URL:http://localhost:8000}/transcribe

# Swagger/OpenAPI
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Twilio SMS Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:dummy_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:dummy_token}
  from-number: ${TWILIO_FROM_NUMBER:dummy_number}

# Agora Configuration (Video Call)
agora:
  app-id: ${AGORA_APP_ID:71fffdd590e54202bc1ea70e751324ce}
  app-certificate: ${AGORA_APP_CERTIFICATE:}
  token-expiry-seconds: ${AGORA_TOKEN_EXPIRY_SECONDS:3600}