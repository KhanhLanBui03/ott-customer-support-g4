services:
  redis:
    image: redis:7-alpine
    container_name: chat-app-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - chat-network

  whisper:
    build:
      context: ../whisper
      dockerfile: Dockerfile
    container_name: chat-app-whisper-prod
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - chat-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-backend-prod
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - APP_WHISPER_URL=http://whisper:8000
    depends_on:
      redis:
        condition: service_healthy
      whisper:
        condition: service_started
    restart: unless-stopped
    networks:
      - chat-network

  caddy:
    image: caddy:2-alpine
    container_name: chat-app-caddy-prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  chat-network:
    driver: bridge

